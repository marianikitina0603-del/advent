name: Chronburg release safety self-test
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-safety-test.yml"
      - ".github/workflows/release-days.yml"
      - "scripts/release_chronburg.py"
      - "data/locked/**"
      - "assets/pic/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dry-run-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install crypto dependency
        run: python -m pip install "cryptography==46.0.4"
      - name: Check encrypted bank and five calendar boundaries without publishing
        env:
          CHRONBURG_RELEASE_KEY: ${{ secrets.CHRONBURG_RELEASE_KEY }}
        run: |
          set -euo pipefail
          test -n "$CHRONBURG_RELEASE_KEY"
          python scripts/release_chronburg.py --dry-run --as-of 2026-11-30 > /tmp/before.txt
          python scripts/release_chronburg.py --dry-run --as-of 2026-12-02 > /tmp/second.txt
          python scripts/release_chronburg.py --dry-run --as-of 2026-12-03 > /tmp/third.txt
          python scripts/release_chronburg.py --dry-run --as-of 2026-12-04 > /tmp/fourth.txt
          python scripts/release_chronburg.py --dry-run --as-of 2026-12-05 > /tmp/fifth.txt
          python scripts/release_chronburg.py --dry-run --as-of 2026-12-06 > /tmp/sixth.txt
          grep -q 'Day 02: locked until 2026-12-02' /tmp/before.txt
          grep -q 'Day 03: locked until 2026-12-03' /tmp/before.txt
          grep -q 'Day 04: locked until 2026-12-04' /tmp/before.txt
          grep -q 'Day 05: locked until 2026-12-05' /tmp/before.txt
          grep -q 'Day 06: locked until 2026-12-06' /tmp/before.txt
          grep -q 'Day 02: eligible (dry run)' /tmp/second.txt
          grep -q 'Day 03: locked until 2026-12-03' /tmp/second.txt
          grep -q 'Day 02: eligible (dry run)' /tmp/third.txt
          grep -q 'Day 03: eligible (dry run)' /tmp/third.txt
          grep -q 'Day 04: locked until 2026-12-04' /tmp/third.txt
          grep -q 'Day 04: eligible (dry run)' /tmp/fourth.txt
          grep -q 'Day 05: locked until 2026-12-05' /tmp/fourth.txt
          grep -q 'Day 05: eligible (dry run)' /tmp/fifth.txt
          grep -q 'Day 06: locked until 2026-12-06' /tmp/fifth.txt
          grep -q 'Day 06: eligible (dry run)' /tmp/sixth.txt
          test ! -e data/day02.json
          test ! -e data/day03.json
          test ! -e data/day04.json
          test ! -e data/day05.json
          test ! -e data/day06.json
          echo 'PASS: key decrypts, date boundaries valid, future tasks remain unpublished'
