name: Release Chronburg daily exam tasks

on:
  schedule:
    # Moscow is UTC+3 year-round. This publishes shortly after local midnight
    # with retries; GitHub Actions schedules can be delayed under load.
    - cron: "13,43 21,22 * 11,12 *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned encryption dependency
        run: python -m pip install "cryptography==46.0.4"

      - name: Decrypt and publish only due days
        id: publish
        env:
          CHRONBURG_RELEASE_KEY: ${{ secrets.CHRONBURG_RELEASE_KEY }}
        run: python scripts/release_chronburg.py

      - name: Commit newly released questions
        if: steps.publish.outputs.changed == 'true'
        run: |
          git config user.name "chronburg-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/day??.json
          git commit -m "Release Chronburg exam tasks by calendar date"
          git push

      # Commits made by GITHUB_TOKEN do NOT trigger the normal push-based Pages
      # workflow. Deploy from this workflow directly after publishing.
      - name: Configure GitHub Pages
        if: steps.publish.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload updated website
        if: steps.publish.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy updated website
        if: steps.publish.outputs.changed == 'true'
        id: deploy
        uses: actions/deploy-pages@v4
